          name: android-libs
          path: sneeze-libs
          github-token: ${{ secrets.SNEEZE_TOKEN }}

      - name: Download SDL3
        # Reuse the android sdl3 artifact — see note in the sdl3: matrix.
        uses: actions/download-artifact@v4
        with:
          name: sdl3-android
          path: sdl3-install

      - name: Download host glslang
        uses: actions/download-artifact@v4
        with:
          repository: ${{ env.SNEEZE_REPO }}
          run-id: ${{ needs.find-sneeze.outputs.run_id }}
          name: linux-glslang
          path: host-glslang
          github-token: ${{ secrets.SNEEZE_TOKEN }}

      - name: Arrange Sneeze libs
        run: |
          rm -rf Sneeze/libs-android
          if [ -d sneeze-libs/libs-android ]; then
            mv sneeze-libs/libs-android Sneeze/libs-android
          else
            mkdir -p Sneeze
            mv sneeze-libs Sneeze/libs-android
          fi
          rm -rf sneeze-libs
          find Sneeze/libs-android -path '*/install/bin/*' -type f -exec chmod +x {} +
          HOST_GLSLANG=$(find host-glslang -path '*/install/bin/glslang' -type f -print -quit)
          if [ -n "$HOST_GLSLANG" ]; then
            mkdir -p Sneeze/libs-android/glslang/install/bin
            mv "$HOST_GLSLANG" Sneeze/libs-android/glslang/install/bin/glslang
            chmod +x Sneeze/libs-android/glslang/install/bin/glslang
          fi
          rm -rf host-glslang
          echo "Sneeze libs:" && ls Sneeze/libs-android/

      - name: Build Rubidium for Quest
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cmake -S src -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DRUBIDIUM_PLATFORM=quest-arm64 \
            -DSNEEZE_ENABLE_XR=ON \
            -DSNEEZE_DIR=${{ github.workspace }}/Sneeze \
            -DLIBS_DIR=${{ github.workspace }}/Sneeze/libs-android \
            -DSDL3_ROOT=${{ github.workspace }}/sdl3-install
          cmake --build build --parallel $(nproc)

      - name: Stage runtime .so bundle for APK
        # SDLActivity's default getLibraries() loads libSDL3.so then libmain.so,
        # so rename libRubidium.so -> libmain.so to match.
        # CMAKE_LIBRARY_OUTPUT_DIRECTORY routes to install/<config>/bin/ —
        # see note in the android job above. Same staging shape as the phone
        # android job: libanari + libc++_shared must come along or
        # SDLActivity's dlopen chain fails at startup.
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          mkdir -p build/runtime-libs
          cp build/install/release/bin/libRubidium.so build/runtime-libs/libmain.so
          cp sdl3-install/lib/libSDL3.so build/runtime-libs/
          cp Sneeze/libs-android/Wasmtime/install/lib/libwasmtime.so build/runtime-libs/
          cp Sneeze/libs-android/ANARI-SDK/install/lib/libanari.so build/runtime-libs/
          cp Sneeze/libs-android/Halogen/install/lib/libanari_library_halogen.so build/runtime-libs/
          LIBCXX_SO=$(find "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt" \
             -path "*/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
             | head -1)
          cp "$LIBCXX_SO" build/runtime-libs/

      - uses: actions/upload-artifact@v4
        with:
          name: rubidium-quest
          path: |
            build/runtime-libs/*.so
            pkg/android/AndroidManifest-quest.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # APK packaging — disabled temporarily (needs android job)
  # ---------------------------------------------------------------------------

  apk-android:
    if: false
    needs: android
    runs-on: ubuntu-22.04
    env:
      MIN_SDK: "26"
      TARGET_SDK: "34"
      BUILD_TOOLS: "34.0.0"
      SDL3_TAG: release-3.2.12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK build-tools + platform
        # SDL3's Java references VibratorManager (API 31) and Insets (API 29)
        # so javac needs the android-${TARGET_SDK} jar for compilation even
        # though runtime min-sdk is lower.
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          curl -sSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip && rm tools.zip
          mv cmdline-tools latest
          yes 2>/dev/null | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;${{ env.BUILD_TOOLS }}" "platforms;android-${{ env.TARGET_SDK }}"
          echo "ANDROID_SDK=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Download Rubidium native libs
        uses: actions/download-artifact@v4
        with:
          name: rubidium-android-arm64
          path: native

      - name: Clone SDL3 for Java sources
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: ${{ env.SDL3_TAG }}
          path: SDL

      - name: Package APK
        run: |
          SDK="$ANDROID_SDK"
          BT="$SDK/build-tools/${{ env.BUILD_TOOLS }}"
          PLATFORM_JAR="$SDK/platforms/android-${{ env.TARGET_SDK }}/android.jar"
          VERSION=$(cat VERSION)

          mkdir -p stage/lib/arm64-v8a stage/classes

          # 1. Compile SDL3 Java activity → DEX
          # Compile SDL3's Activity + Rubidium's MainActivity. pkg/android/java
          # was getting skipped previously, which produced an APK whose
          # classes.dex lacked com.rp1.Rubidium.MainActivity — Android then
          # killed the process at launch with ClassNotFoundException.
          { find SDL/android-project/app/src/main/java -name '*.java'
            find pkg/android/java                       -name '*.java'
          } | xargs javac -source 1.8 -target 1.8 -cp "$PLATFORM_JAR" -d stage/classes
          "$BT/d8" --lib "$PLATFORM_JAR" --output stage \
            $(find stage/classes -name '*.class')

          # 2. Compile + link resources (app icon etc.)
          "$BT/aapt2" compile --dir pkg/android/res -o stage/res.zip
          "$BT/aapt2" link -o stage/unaligned.apk \
            -I "$PLATFORM_JAR" \
            --manifest pkg/android/AndroidManifest.xml \
            --min-sdk-version ${{ env.MIN_SDK }} \
            --target-sdk-version ${{ env.TARGET_SDK }} \
            --version-code 1 \
            --version-name "$VERSION" \
            stage/res.zip

          # 3. Stage native libs
          cp native/*.so stage/lib/arm64-v8a/
          ls -la stage/lib/arm64-v8a/

          # 4. Add DEX + lib/ into APK zip
          (cd stage && zip -u unaligned.apk classes.dex && zip -ur unaligned.apk lib/)

          # 5. Align + sign with debug keystore
          "$BT/zipalign" -f 4 stage/unaligned.apk stage/aligned.apk
          keytool -genkeypair -keystore stage/debug.keystore -alias key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Rubidium Debug,O=Metaversal,C=US" 2>/dev/null
          "$BT/apksigner" sign \
            --ks stage/debug.keystore --ks-key-alias key \
            --ks-pass pass:android --key-pass pass:android \
            --out rubidium-android-arm64.apk stage/aligned.apk

          ls -la rubidium-android-arm64.apk
          "$BT/apksigner" verify rubidium-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rubidium-android-apk
          path: rubidium-android-arm64.apk
          retention-days: 7

